name: Setup Labels

on:
  workflow_dispatch:
    inputs:
      framework-repository:
        description: "Repository providing this engine (owner/repo)"
        required: false
        type: string
        default: "TomzxCode/llm-augmented-workflows"
      framework-ref:
        description: "Ref of the engine repository to check out"
        required: false
        type: string
        default: "main"
  workflow_call:
    inputs:
      framework-repository:
        description: "Repository providing this engine (owner/repo)"
        required: false
        type: string
        default: "TomzxCode/llm-augmented-workflows"
      framework-ref:
        description: "Ref of the engine repository to check out"
        required: false
        type: string
        default: "main"

permissions:
  contents: read
  issues: write

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Checkout engine
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.framework-repository || 'TomzxCode/llm-augmented-workflows' }}
          ref: ${{ inputs.framework-ref || 'main' }}
          path: .llmaw
          fetch-depth: 1

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          working-directory: .llmaw

      - name: Sync labels from flows.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLOWS_FILE: .github/flows.yml
        run: uv run --project .llmaw llmaw sync-labels
