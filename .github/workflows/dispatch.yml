name: LLM Workflows Dispatch

on:
  issues:
    types: [opened, labeled, reopened, closed]
  pull_request:
    types: [closed, labeled, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      model:
        description: "opencode model id (provider/model)"
        required: false
        type: string
        default: "opencode/deepseek-v4-flash-free"
      agents-repository:
        description: "Repository providing opencode skills (owner/repo)"
        required: false
        type: string
        default: "tomzx/agents"
      framework-repository:
        description: "Repository providing this engine (owner/repo)"
        required: false
        type: string
        default: "TomzxCode/llm-augmented-workflows"
      framework-ref:
        description: "Ref of the engine repository to check out"
        required: false
        type: string
        default: "main"
      execution:
        description: "Force execution mode: 'continuous' (chain rules in one job until needs-human) or 'event-driven' (one rule per dispatch). Empty resolves from flows.yml."
        required: false
        type: string
        default: ""
      rule-id:
        description: "Dry-run: force-run a single rule by id (skips event matching)"
        required: false
        type: string
  workflow_call:
    inputs:
      model:
        description: "opencode model id (provider/model)"
        required: false
        type: string
        default: "opencode/deepseek-v4-flash-free"
      agents-repository:
        description: "Repository providing opencode skills (owner/repo)"
        required: false
        type: string
        default: "tomzx/agents"
      framework-repository:
        description: "Repository providing this engine (owner/repo)"
        required: false
        type: string
        default: "TomzxCode/llm-augmented-workflows"
      framework-ref:
        description: "Ref of the engine repository to check out"
        required: false
        type: string
        default: "main"
      execution:
        description: "Force execution mode: 'continuous' or 'event-driven'. Empty resolves from flows.yml."
        required: false
        type: string
        default: ""
      rule-id:
        description: "Dry-run: force-run a single rule by id (skips event matching)"
        required: false
        type: string
    secrets:
      LLMAW_APP_PRIVATE_KEY:
        description: "PEM private key for the GitHub App"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # Resolution order: workflow input > repository variable > hardcoded default.
  MODEL: ${{ inputs.model || vars.OPENCODE_MODEL || 'opencode/deepseek-v4-flash-free' }}
  AGENTS_REPOSITORY: ${{ inputs.agents-repository || vars.AGENTS_REPOSITORY || 'tomzx/agents' }}

concurrency:
  group: llmaw-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Mint a GitHub App installation token. Events produced by the default
      # GITHUB_TOKEN never trigger downstream workflows (anti-recursion), so the
      # label state-machine would stall. All chaining mutations (labels, PR
      # create/merge, comments, git push) must be attributed to the App instead.
      # Requires repo/org secrets LLMAW_APP_ID and LLMAW_APP_PRIVATE_KEY, and the
      # App installed with contents/issues/pull-requests write + metadata read.
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.LLMAW_CLIENT_ID }}
          private-key: ${{ secrets.LLMAW_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout engine
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.framework-repository || 'TomzxCode/llm-augmented-workflows' }}
          ref: ${{ inputs.framework-ref || 'main' }}
          path: .llmaw
          fetch-depth: 1

      # Pin the llmaw tooling (flows.yml + scripts) to main: snapshot it before
      # any rule switches the working tree to the per-issue branch. Skills still
      # edit and commit the branch's content; only the automation that drives
      # them (flows.yml, scripts) is pinned, so in-flight issues pick up fixes
      # the moment they land on main. LLMAW_TOOLING_ROOT + FLOWS_FILE are read
      # by the engine to resolve scripts and (re-)read flows in continuous mode.
      - name: Pin llmaw tooling to main
        run: |
          tooling="${RUNNER_TEMP}/llmaw-tooling"
          rm -rf "${tooling}"
          mkdir -p "${tooling}/.github"
          cp -r .github/llmaw "${tooling}/.github/llmaw"
          echo "LLMAW_TOOLING_ROOT=${tooling}" >> "${GITHUB_ENV}"
          echo "FLOWS_FILE=${tooling}/.github/llmaw/flows.yml" >> "${GITHUB_ENV}"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          working-directory: .llmaw
          
      - name: Route event to matching rules
        id: route
        env:
          FORCE_RULE_ID: ${{ inputs.rule-id }}
          EXECUTION: ${{ inputs.execution || vars.LLMAW_EXECUTION || '' }}
          MATCHED_FILE: ${{ runner.temp }}/llmaw-matched.json
        run: uv run --project .llmaw llmaw route

      - name: Install opencode
        if: steps.route.outputs.has_agent == 'true'
        run: |
          set -eo pipefail
          install_url="https://opencode.ai/install"
          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Attempt ${attempt}/${max_attempts}: installing opencode"
            if curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 "$install_url" | bash; then
              echo "opencode installed successfully"
              exit 0
            fi
            echo "Attempt ${attempt} failed" >&2
            [ "$attempt" -lt "$max_attempts" ] && sleep "$((attempt * 10))"
          done
          echo "All ${max_attempts} opencode install attempts failed" >&2
          exit 1

      - name: Install skills from ${{ env.AGENTS_REPOSITORY }}
        if: steps.route.outputs.has_agent == 'true'
        run: |
          agents="$RUNNER_TEMP/agents"
          git clone "https://github.com/${AGENTS_REPOSITORY}" "$agents"
          ln -s "$agents/skills" "$HOME/.opencode/skills"
          mkdir -p "$HOME/.config/opencode"
          ln -s "$agents/AGENTS.md" "$HOME/.config/opencode/AGENTS.md"

      - name: Run matched rules
        if: steps.route.outputs.count != '0'
        env:
          MATCHED_FILE: ${{ runner.temp }}/llmaw-matched.json
          OUTCOME_YAML: ${{ runner.temp }}/outcome.yaml
          EXECUTION: ${{ steps.route.outputs.execution }}
          LLMAW_MAX_ITERATIONS: ${{ vars.LLMAW_MAX_ITERATIONS || '30' }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENCODE_DISABLE_AUTO_UPDATE: "1"
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          LABEL: ${{ github.event.label.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_TYPE: ${{ github.event_name == 'pull_request_review_comment' && 'inline' || 'general' }}
        run: uv run --project .llmaw llmaw run-rule
