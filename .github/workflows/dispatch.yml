name: LLM Workflows Dispatch

on:
  issues:
    types: [opened, labeled, reopened, closed]
  pull_request:
    types: [closed, labeled, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      model:
        description: "opencode model id (provider/model)"
        required: false
        type: string
        default: "opencode/deepseek-v4-flash-free"
      agents-repository:
        description: "Repository providing opencode skills (owner/repo)"
        required: false
        type: string
        default: "tomzx/agents"
      framework-repository:
        description: "Repository providing this engine (owner/repo)"
        required: false
        type: string
        default: "TomzxCode/llm-augmented-workflows"
      framework-ref:
        description: "Ref of the engine repository to check out"
        required: false
        type: string
        default: "main"
      rule-id:
        description: "Dry-run: force-run a single rule by id (skips event matching)"
        required: false
        type: string
  workflow_call:
    inputs:
      model:
        description: "opencode model id (provider/model)"
        required: false
        type: string
        default: "opencode/deepseek-v4-flash-free"
      agents-repository:
        description: "Repository providing opencode skills (owner/repo)"
        required: false
        type: string
        default: "tomzx/agents"
      framework-repository:
        description: "Repository providing this engine (owner/repo)"
        required: false
        type: string
        default: "TomzxCode/llm-augmented-workflows"
      framework-ref:
        description: "Ref of the engine repository to check out"
        required: false
        type: string
        default: "main"

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # Resolution order: workflow input > repository variable > hardcoded default.
  MODEL: ${{ inputs.model || vars.OPENCODE_MODEL || 'opencode/deepseek-v4-flash-free' }}
  AGENTS_REPOSITORY: ${{ inputs.agents-repository || vars.AGENTS_REPOSITORY || 'tomzx/agents' }}

concurrency:
  group: llmaw-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      matched: ${{ steps.route.outputs.matched }}
      count: ${{ steps.route.outputs.count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout engine
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.framework-repository || 'TomzxCode/llm-augmented-workflows' }}
          ref: ${{ inputs.framework-ref || 'main' }}
          path: .llmaw
          fetch-depth: 1

      - name: Setup uv
        uses: astral-sh/setup-uv@8.2.0

      - name: Route event to matching rules
        id: route
        env:
          FLOWS_FILE: .github/flows.yml
          FORCE_RULE_ID: ${{ inputs.rule-id }}
        run: uv run --project .llmaw llmaw route

  run-rule:
    needs: route
    if: needs.route.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rule: ${{ fromJson(needs.route.outputs.matched) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout engine
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.framework-repository || 'TomzxCode/llm-augmented-workflows' }}
          ref: ${{ inputs.framework-ref || 'main' }}
          path: .llmaw
          fetch-depth: 1

      - name: Setup uv
        uses: astral-sh/setup-uv@8.2.0

      - name: Run deterministic steps
        if: matrix.rule.has_deterministic == true
        env:
          MATCHED_RULE: ${{ toJSON(matrix.rule) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: uv run --project .llmaw llmaw run-steps

      - name: Install opencode
        if: matrix.rule.has_agent == true
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Install skills from ${{ matrix.rule.agent.agents_repository }}
        if: matrix.rule.has_agent == true
        env:
          AGENTS_REPOSITORY: ${{ matrix.rule.agent.agents_repository }}
        run: |
          agents="$RUNNER_TEMP/agents"
          git clone "https://github.com/${AGENTS_REPOSITORY}" "$agents"
          ln -s "$agents/skills" "$HOME/.opencode/skills"
          mkdir -p "$HOME/.config/opencode"
          ln -s "$agents/AGENTS.md" "$HOME/.config/opencode/AGENTS.md"

      - name: Run agent
        if: matrix.rule.has_agent == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_DISABLE_AUTO_UPDATE: "1"
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          LABEL: ${{ github.event.label.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_TYPE: ${{ github.event_name == 'pull_request_review_comment' && 'inline' || 'general' }}
        run: |
          if [ "${{ matrix.rule.agent.kind }}" = "skill" ]; then
            opencode run \
              --model "${{ matrix.rule.agent.model }}" \
              --dangerously-skip-permissions \
              --command "${{ matrix.rule.agent.ref }}"
          else
            opencode run \
              --model "${{ matrix.rule.agent.model }}" \
              --dangerously-skip-permissions \
              "$(cat '${{ matrix.rule.agent.ref }}')"
          fi
