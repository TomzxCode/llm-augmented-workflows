name: Plan Generation

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      model:
        description: "opencode model id (provider/model)"
        required: false
        type: string
        default: "opencode/deepseek-v4-flash-free"
      agents-repository:
        description: "Repository providing opencode skills (owner/repo)"
        required: false
        type: string
        default: "tomzx/agents"
  workflow_call:
    inputs:
      model:
        description: "opencode model id (provider/model)"
        required: false
        type: string
        default: "opencode/deepseek-v4-flash-free"
      agents-repository:
        description: "Repository providing opencode skills (owner/repo)"
        required: false
        type: string
        default: "tomzx/agents"

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # Set to empty string to trigger on issue creation, or a label name to trigger on that label
  TRIGGER_LABEL: 'plan-needed'
  # Resolution order: workflow input > repository variable > hardcoded default
  MODEL: ${{ inputs.model || vars.OPENCODE_MODEL || 'opencode/deepseek-v4-flash-free' }}
  AGENTS_REPOSITORY: ${{ inputs.agents-repository || vars.AGENTS_REPOSITORY || 'tomzx/agents' }}

jobs:
  check-labels:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      issue_number: ${{ steps.check.outputs.issue_number }}
    steps:
      - name: Check if workflow should run
        id: check
        uses: actions/github-script@v8
        with:
          script: |
            const triggerLabel = '${{ env.TRIGGER_LABEL }}';
            const eventType = context.eventName;
            const issueNumber = context.payload.issue.number;
            const action = context.payload.action;

            core.info(`Trigger label: "${triggerLabel}"`);
            core.info(`Event type: ${eventType}`);
            core.info(`Action: ${action}`);
            core.info(`Issue number: ${issueNumber}`);

            core.setOutput('issue_number', issueNumber);

            // If trigger label is not set, run on issue creation
            if (!triggerLabel || triggerLabel === '') {
              core.info(`Trigger label is empty - checking for issue creation event`);
              if (eventType === 'issues' && action === 'opened') {
                core.info(`Running: Issue opened and no trigger label configured`);
                core.setOutput('should_run', 'true');
              } else {
                core.info(`Skipping: Issue not opened (action: ${action})`);
                core.setOutput('should_run', 'false');
              }
              return;
            }

            // If trigger label is set, only run when that label is added
            if (eventType === 'issues' && action === 'labeled') {
              const addedLabel = context.payload.label.name;
              core.info(`Label added: "${addedLabel}"`);
              if (addedLabel === triggerLabel) {
                core.info(`Running: Trigger label "${triggerLabel}" was added`);
                core.setOutput('should_run', 'true');
              } else {
                core.info(`Skipping: Label "${addedLabel}" does not match trigger label "${triggerLabel}"`);
                core.setOutput('should_run', 'false');
              }
            } else {
              core.info(`Skipping: Event type ${eventType}/${action} does not match expected conditions`);
              core.setOutput('should_run', 'false');
            }

  generate-plan:
    needs: check-labels
    if: needs.check-labels.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}

      - name: Ensure plans directory exists
        run: mkdir -p plans

      - name: Install opencode
        # The installer drops the binary at ~/.opencode/bin and appends it to
        # $GITHUB_PATH, so `opencode` is on PATH for the steps below.
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Install skills from ${{ env.AGENTS_REPOSITORY }}
        run: |
          agents="$RUNNER_TEMP/agents"
          git clone "https://github.com/${AGENTS_REPOSITORY}" "$agents"
          # Global skill discovery reads ~/.opencode/skills and the global
          # AGENTS.md is read from ~/.config/opencode/AGENTS.md.
          ln -s "$agents/skills" "$HOME/.opencode/skills"
          mkdir -p "$HOME/.config/opencode"
          ln -s "$agents/AGENTS.md" "$HOME/.config/opencode/AGENTS.md"

      - name: Generate plan with opencode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_DISABLE_AUTO_UPDATE: "1"
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.check-labels.outputs.issue_number }}
        run: |
          opencode run \
            --model "$MODEL" \
            --dangerously-skip-permissions \
            --command generate-plan
