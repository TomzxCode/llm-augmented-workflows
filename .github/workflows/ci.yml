name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@8.2.0

      - name: Lint
        run: uv run --group dev ruff check src tests

      - name: Test
        run: uv run --group dev pytest -q
